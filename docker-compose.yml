services:
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: storagelens-jaeger
    ports:
      - "16686:16686"   # Jaeger UI  →  http://localhost:16686
      - "4317:4317"     # OTLP gRPC  (used by all services)
      - "4318:4318"     # OTLP HTTP  (alternative)
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  redis:
    image: redis:7-alpine
    container_name: storagelens-redis
    ports:
      - "6379:6379"
    command: redis-server --save "" --loglevel warning

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: storagelens-sql
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "${STORAGELENS_SQL_PASSWORD}"
    ports:
      - "14333:1433"
    volumes:
      - storagelens-sql-data:/var/opt/mssql

  rabbitmq:
    image: rabbitmq:3-management
    container_name: storagelens-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  locations:
    build:
      context: .
      dockerfile: src/StorageLens.Services.Locations/Dockerfile
    ports:
      - "5101:8080"
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__LocationsDb: "${STORAGELENS_AZURE_SQL_CONNECTION_STRING:-Server=sqlserver,1433;Database=StorageLensLocations;User Id=sa;Password=${STORAGELENS_SQL_PASSWORD};TrustServerCertificate=True;}"
      Database__UseInMemory: "false"
      ServiceApiKey: "${STORAGELENS_SERVICE_API_KEY}"
      RateLimit__Redis: "redis:6379"
      Observability__OtlpEndpoint: "http://jaeger:4317"
    depends_on:
      - sqlserver
      - jaeger
      - redis

  scanjobs:
    build:
      context: .
      dockerfile: src/StorageLens.Services.ScanJobs/Dockerfile
    ports:
      - "5102:8080"
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__ScanJobsDb: "${STORAGELENS_AZURE_SQL_CONNECTION_STRING:-Server=sqlserver,1433;Database=StorageLensScanJobs;User Id=sa;Password=${STORAGELENS_SQL_PASSWORD};TrustServerCertificate=True;}"
      Database__UseInMemory: "false"
      ServiceApiKey: "${STORAGELENS_SERVICE_API_KEY}"
      RateLimit__Redis: "redis:6379"
      Observability__OtlpEndpoint: "http://jaeger:4317"
    depends_on:
      - sqlserver
      - jaeger
      - redis

  fileinventory:
    build:
      context: .
      dockerfile: src/StorageLens.Services.FileInventory/Dockerfile
    ports:
      - "5103:8080"
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__FileInventoryDb: "${STORAGELENS_AZURE_SQL_CONNECTION_STRING:-Server=sqlserver,1433;Database=StorageLensFileInventory;User Id=sa;Password=${STORAGELENS_SQL_PASSWORD};TrustServerCertificate=True;}"
      Database__UseInMemory: "false"
      ServiceApiKey: "${STORAGELENS_SERVICE_API_KEY}"
      RateLimit__Redis: "redis:6379"
      Observability__OtlpEndpoint: "http://jaeger:4317"
    depends_on:
      - sqlserver
      - jaeger
      - redis

  duplicates:
    build:
      context: .
      dockerfile: src/StorageLens.Services.Duplicates/Dockerfile
    ports:
      - "5104:8080"
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DuplicatesDb: "${STORAGELENS_AZURE_SQL_CONNECTION_STRING:-Server=sqlserver,1433;Database=StorageLensDuplicates;User Id=sa;Password=${STORAGELENS_SQL_PASSWORD};TrustServerCertificate=True;}"
      Database__UseInMemory: "false"
      UpstreamServices__FileInventory: "http://fileinventory:8080/"
      ServiceApiKey: "${STORAGELENS_SERVICE_API_KEY}"
      RateLimit__Redis: "redis:6379"
      Observability__OtlpEndpoint: "http://jaeger:4317"
    depends_on:
      - sqlserver
      - fileinventory
      - jaeger
      - redis

  analytics:
    build:
      context: .
      dockerfile: src/StorageLens.Services.Analytics/Dockerfile
    ports:
      - "5105:8080"
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      UpstreamServices__Locations: "http://locations:8080/"
      UpstreamServices__ScanJobs: "http://scanjobs:8080/"
      UpstreamServices__FileInventory: "http://fileinventory:8080/"
      UpstreamServices__Duplicates: "http://duplicates:8080/"
      ServiceApiKey: "${STORAGELENS_SERVICE_API_KEY}"
      RateLimit__Redis: "redis:6379"
      Observability__OtlpEndpoint: "http://jaeger:4317"
    depends_on:
      - locations
      - scanjobs
      - fileinventory
      - duplicates
      - jaeger
      - redis

  scanner:
    build:
      context: .
      dockerfile: src/StorageLens.Services.Scanner/Dockerfile
    ports:
      - "5106:8080"
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__ScannerDb: "${STORAGELENS_AZURE_SQL_CONNECTION_STRING:-Server=sqlserver,1433;Database=StorageLensScanner;User Id=sa;Password=${STORAGELENS_SQL_PASSWORD};TrustServerCertificate=True;}"
      Database__UseInMemory: "false"
      UpstreamServices__FileInventory: "http://fileinventory:8080/"
      UpstreamServices__ScanJobs: "http://scanjobs:8080/"
      ServiceApiKey: "${STORAGELENS_SERVICE_API_KEY}"
      RateLimit__Redis: "redis:6379"
      Observability__OtlpEndpoint: "http://jaeger:4317"
    volumes:
      - ./sample-scan:/scan-root
      # The following Windows-specific mounts enable Scanner's built-in
      # C:\ and UNC path auto-mapping (e.g., C:\ -> /host/drives/c).
      # Uncomment these lines if you are running Docker Compose on Windows
      # and want to scan local/UNC paths using the /host/drives and /host/unc
      # conventions inside the container.
      # - /host/drives:/host/drives
      # - /host/unc:/host/unc
    depends_on:
      - sqlserver
      - fileinventory
      - scanjobs
      - jaeger
      - redis

  hashing:
    build:
      context: .
      dockerfile: src/StorageLens.Services.Hashing/Dockerfile
    ports:
      - "5107:8080"
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__HashingDb: "${STORAGELENS_AZURE_SQL_CONNECTION_STRING:-Server=sqlserver,1433;Database=StorageLensHashing;User Id=sa;Password=${STORAGELENS_SQL_PASSWORD};TrustServerCertificate=True;}"
      Database__UseInMemory: "false"
      UpstreamServices__FileInventory: "http://fileinventory:8080/"
      UpstreamServices__ScanJobs: "http://scanjobs:8080/"
      HashingWorker__MaxDegreeOfParallelism: "4"
      HashingWorker__BatchSize: "500"
      HashingWorker__MaxFileSizeBytes: "2147483648"
      ServiceApiKey: "${STORAGELENS_SERVICE_API_KEY}"
      RateLimit__Redis: "redis:6379"
      Observability__OtlpEndpoint: "http://jaeger:4317"
    volumes:
      - ./sample-scan:/scan-root
    depends_on:
      - sqlserver
      - fileinventory
      - scanjobs
      - jaeger
      - redis

  orchestrator:
    build:
      context: .
      dockerfile: src/StorageLens.Services.Orchestrator/Dockerfile
    ports:
      - "5108:8080"
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__OrchestratorDb: "${STORAGELENS_AZURE_SQL_CONNECTION_STRING:-Server=sqlserver,1433;Database=StorageLensOrchestration;User Id=sa;Password=${STORAGELENS_SQL_PASSWORD};TrustServerCertificate=True;}"
      Database__UseInMemory: "false"
      UpstreamServices__Locations: "http://locations:8080/"
      UpstreamServices__ScanJobs: "http://scanjobs:8080/"
      UpstreamServices__Scanner: "http://scanner:8080/"
      UpstreamServices__Hashing: "http://hashing:8080/"
      UpstreamServices__Duplicates: "http://duplicates:8080/"
      UpstreamServices__Analytics: "http://analytics:8080/"
      ServiceApiKey: "${STORAGELENS_SERVICE_API_KEY}"
      RateLimit__Redis: "redis:6379"
      Observability__OtlpEndpoint: "http://jaeger:4317"
    depends_on:
      - sqlserver
      - locations
      - scanjobs
      - scanner
      - hashing
      - duplicates
      - analytics
      - jaeger
      - redis

  web:
    build:
      context: .
      dockerfile: src/StorageLens.Web/Dockerfile
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      DatabaseConfig__UseInMemory: "true"
      ServiceEndpoints__Locations: "http://locations:8080/"
      ServiceEndpoints__ScanJobs: "http://scanjobs:8080/"
      ServiceEndpoints__FileInventory: "http://fileinventory:8080/"
      ServiceEndpoints__Duplicates: "http://duplicates:8080/"
      ServiceEndpoints__Analytics: "http://analytics:8080/"
      ServiceEndpoints__Orchestrator: "http://orchestrator:8080/"
      ServiceApiKey: "${STORAGELENS_SERVICE_API_KEY}"
      RateLimit__Redis: "redis:6379"
      Observability__OtlpEndpoint: "http://jaeger:4317"
    depends_on:
      - locations
      - scanjobs
      - fileinventory
      - duplicates
      - analytics
      - orchestrator
      - jaeger
      - redis

volumes:
  storagelens-sql-data:
