name: code-quality

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]

jobs:
  quality-checks:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore StorageLens.sln

      - name: Verify formatting
        run: dotnet format StorageLens.sln --verify-no-changes --verbosity minimal

      - name: Verify package vulnerabilities
        shell: bash
        run: |
          set -euo pipefail
          output=$(dotnet list StorageLens.sln package --vulnerable --include-transitive)
          echo "$output"
          if echo "$output" | grep -q "has the following vulnerable packages"; then
            echo "Vulnerable packages detected."
            exit 1
          fi

      - name: Build
        run: dotnet build StorageLens.sln --configuration Release --no-restore
