name: Documentation Guard

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  docs-guard:
    name: Require docs for code changes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changed file groups
        id: changes
        uses: dorny/paths-filter@v4
        with:
          filters: |
            # Documentation files (must be updated when source/config changes)
            docs:
              - 'docs/**'
            # CHANGELOG specifically (always required for any source/config change)
            docs_changelog:
              - 'docs/CHANGELOG.md'
            # Files that trigger documentation requirement
            # If any of these change, docs/ must be updated and CHANGELOG.md must have entry
            source_or_config:
              # Source code and tests
              - 'src/**'
              - 'tests/**'
              # Infrastructure and deployment
              - 'infra/**'
              - 'scripts/**'
              - '.github/workflows/**'
              - 'docker-compose.yml'
              - 'azure.yaml'
              - 'StorageLens.sln'
              - 'StorageLens.slnx'
              # README (part of docs)
              - 'README.md'
              # Copilot configuration (treated as source code for guardrail purposes)
              - '.instructions.md'
              - '.prompt.md'
              - '.agent.md'
              - 'SKILL.md'
              - 'copilot-instructions.md'
              - 'AGENTS.md'

      - name: Enforce docs updates
        shell: bash
        run: |
          echo "docs changed: ${{ steps.changes.outputs.docs }}"
          echo "docs changelog changed: ${{ steps.changes.outputs.docs_changelog }}"
          echo "source/config changed: ${{ steps.changes.outputs.source_or_config }}"

          # Rule 1: If source/config changed, at least one docs file must change
          if [[ "${{ steps.changes.outputs.source_or_config }}" == "true" && "${{ steps.changes.outputs.docs }}" != "true" ]]; then
            echo "❌ GUARD FAILURE: Documentation update required"
            echo ""
            echo "You changed source/config/workflow files but did not update any files in docs/"
            echo ""
            echo "What to do:"
            echo "1. Update relevant documentation in docs/ folder"
            echo "   - API changes? → Update docs/technical/api-specification.md"
            echo "   - Service changes? → Update docs/architecture/microservices-architecture.md"
            echo "   - Deployment changes? → Update docs/operations/deployment-guide.md"
            echo "   - See: docs/developer/documentation-guardrail.md for full requirements"
            echo ""
            echo "2. Update docs/CHANGELOG.md with your change (required separately)"
            echo ""
            echo "3. Push the documentation changes to this PR"
            echo ""
            exit 1
          fi

          # Rule 2: If source/config changed, CHANGELOG must be updated
          if [[ "${{ steps.changes.outputs.source_or_config }}" == "true" && "${{ steps.changes.outputs.docs_changelog }}" != "true" ]]; then
            echo "❌ GUARD FAILURE: CHANGELOG update required"
            echo ""
            echo "You changed source/config/workflow files but did not update docs/CHANGELOG.md"
            echo ""
            echo "What to do:"
            echo "1. Add an entry to docs/CHANGELOG.md under [Unreleased] → ### Added/Changed/Fixed/Removed"
            echo "2. Include a concise but clear description of your change"
            echo "3. Push the CHANGELOG update to this PR"
            echo ""
            exit 1
          fi

          echo "✅ Documentation guard passed"
